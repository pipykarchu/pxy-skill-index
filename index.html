  <script>
    const skills = JSON.parse(document.getElementById('skill-data').textContent);
    const state = { query: '', category: '全部场景', availability: 'all', sort: 'category' };
    const grid = document.getElementById('skillGrid');
    const empty = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function initials(name) {
      return String(name).split(/[-_\s]+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase();
    }

    function formatBytes(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function categories() {
      return ['全部场景', ...new Set(skills.map(skill => skill.category))];
    }

    function renderTabs() {
      document.getElementById('categoryTabs').innerHTML = categories().map(category =>
        `<button class="category-tab" type="button" data-category="${escapeHtml(category)}" aria-pressed="${state.category === category}">${escapeHtml(category)}</button>`
      ).join('');
    }

    function filteredSkills() {
      const query = state.query.trim().toLowerCase();
      const rows = skills.filter(skill => {
        if (state.category !== '全部场景' && skill.category !== state.category) return false;
        if (state.availability === 'downloadable' && !skill.download) return false;
        if (state.availability === 'index-only' && skill.download) return false;
        if (!query) return true;
        return [skill.name, skill.category, skill.description, skill.usage].join(' ').toLowerCase().includes(query);
      });
      rows.sort((a, b) => {
        if (state.sort === 'name') return a.name.localeCompare(b.name, 'zh-CN');
        if (state.sort === 'download') return Number(Boolean(b.download)) - Number(Boolean(a.download)) || a.name.localeCompare(b.name, 'zh-CN');
        return a.category.localeCompare(b.category, 'zh-CN') || a.name.localeCompare(b.name, 'zh-CN');
      });
      return rows;
    }

    function render() {
      renderTabs();
      const rows = filteredSkills();
      resultCount.textContent = `显示 ${rows.length} / ${skills.length}`;
      empty.hidden = rows.length !== 0;
      grid.innerHTML = rows.map(skill => {
        const icon = skill.icon ? `<img src="${escapeHtml(skill.icon)}" alt="">` : escapeHtml(initials(skill.name));
        const platforms = (skill.platforms || []).map(item => `<span class="tag platform">${escapeHtml(item)}</span>`).join('');
        const action = skill.download
          ? `<a class="download-link" href="${escapeHtml(skill.download)}" download>下载 ZIP</a><span class="size">${escapeHtml(formatBytes(skill.downloadBytes))}</span>`
          : `<span class="unavailable">${escapeHtml(skill.blockReason || '待完成公开分发审核')}</span>`;
        return `<article class="skill-card">
          <div class="skill-top"><div class="skill-icon">${icon}</div><div><h3>${escapeHtml(skill.name)}</h3><div class="category-label">${escapeHtml(skill.category)}</div></div></div>
          <p class="description">${escapeHtml(skill.description || '暂无描述')}</p>
          <p class="usage">${escapeHtml(skill.usage || '')}</p>
          <div class="meta"><span class="tag license">${escapeHtml(skill.license || '许可待确认')}</span>${platforms}</div>
          <div class="card-action">${action}</div>
        </article>`;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', event => { state.query = event.target.value; render(); });
    document.getElementById('availabilitySelect').addEventListener('change', event => { state.availability = event.target.value; render(); });
    document.getElementById('sortSelect').addEventListener('change', event => { state.sort = event.target.value; render(); });
    document.getElementById('categoryTabs').addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      state.category = button.dataset.category;
      render();
    });
    render();
  </script>
</body>
</html>
